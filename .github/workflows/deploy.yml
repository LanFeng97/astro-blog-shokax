name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时构建并发布到 LanFeng97.github.io（用户站点仓库）
  # 若分支名不同，请同步修改 branches
  push:
    branches: [main]
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只允许一个发布任务，避免新旧构建互相覆盖
concurrency:
  group: deploy-lanfeng97-github-io
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # 自动缓存 pnpm store（key 基于 pnpm-lock.yaml）
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      # 把 dist 推送到 LanFeng97/LanFeng97.github.io 的 main 分支，
      # 使 https://lanfeng97.github.io/ 展示本仓库（Astro 新博客）的内容。
      # 需要先在仓库 Secrets 配置 LANFENG97_GITHUB_IO_TOKEN：
      #   一个有 LanFeng97/LanFeng97.github.io 仓库写权限的 PAT（scope: repo）。
      - name: Deploy to LanFeng97.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.LANFENG97_GITHUB_IO_TOKEN }}
          external_repository: LanFeng97/LanFeng97.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: false
          enable_jekyll: false
